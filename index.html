<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abdelmoneim Diab | Visual & Motion Lab</title>
  <meta name="description" content="Portfolio of Abdelmoneim Diab, senior multimedia and graphic designer: social media design, print, reels, commercials and AI video.">
  <meta name="theme-color" content="#E7E5DE">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='14' height='26' fill='%2300AA83'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300..700&family=Gloock&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script>
    // Restore the visitor's language before first paint, and mark JS as available.
    (function () {
      var d = document.documentElement, l = 'en';
      try { l = localStorage.getItem('lang') || (navigator.language || '').slice(0, 2); } catch (e) {}
      if (l === 'ar') { d.lang = 'ar'; d.dir = 'rtl'; }
      d.classList.add('js');
      try { if (sessionStorage.getItem('introSeen')) d.classList.add('intro-seen'); } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <!-- First-visit intro. Hidden by CSS after a few seconds even if JavaScript fails. -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro__stage"><div class="intro__frame" id="introFrame"></div></div>
    <p class="intro__ratio" id="introRatio">9:16</p>
  </div>

  <!-- Page-transition curtain -->
  <div class="curtain" id="curtain" aria-hidden="true"><span class="curtain__label" id="curtainLabel"></span></div>

  <header class="site-header" id="header">
    <a class="mark" href="#/" data-link aria-label="Home">
      <span class="mark__glyph" aria-hidden="true"></span>
      <span class="mark__text"><span class="mark__name" data-t="markName"></span><span class="mark__lab" data-t="markLab"></span></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/work" data-link data-route="work"></a>
      <a href="#/experience" data-link data-route="experience"></a>
      <a href="#/contact" data-link data-route="contact"></a>
    </nav>
    <div class="lang" role="group" id="lang">
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="ar" lang="ar">AR</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- Project viewer -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
    <div class="viewer__media" id="viewerMedia" data-lenis-prevent></div>
    <aside class="viewer__info">
      <h2 class="viewer__title" id="viewerTitle"></h2>
      <dl class="facts" id="viewerFacts"></dl>
      <button type="button" class="viewer__close" id="viewerClose"></button>
    </aside>
  </div>

  <div class="cursor" id="cursor" aria-hidden="true"><span id="cursorLabel"></span></div>

  <noscript><p class="noscript">This site needs JavaScript to show the portfolio. Behance: https://www.behance.net/bodadiab</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js" defer></script>
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
